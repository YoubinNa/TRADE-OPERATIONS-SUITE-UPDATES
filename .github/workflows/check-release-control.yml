name: Check release phase controls without publication
on:
  push:
    branches: [main, review/connector-trigger-20261113]
    paths: ['publisher/control/**', '.github/workflows/prepare-candidate.yml', '.github/workflows/check-release-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: |
            publisher/automation
            publisher/control
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate scope, hold and preserved preflight
        run: |
          node --test publisher/control/test-control.cjs publisher/control/test-execution-request.cjs
          python -B publisher/control/test-preserve-preflight.py
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python -B publisher/control/test-workflow.py
      - name: Reuse existing approval and paired evidence gate tests
        run: |
          python -B publisher/automation/test_release_speed.py
          python -B publisher/automation/test_paired_candidate.py

      - name: Read operational hold with built-in repository authorization
        env:
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          node -e "require('./publisher/control/shared-control.cjs').reader('release-0.1.116-6eb84f19a436',process.env.CONTROL_TOKEN)().then(c=>{console.log(JSON.stringify({controlReadable:c.schema===1,paused:c.paused!==false,customSecretRequired:false,remoteWrites:0}));}).catch(()=>{console.error('PUBLIC_HOLD_READ_FAILED');process.exitCode=1;});"

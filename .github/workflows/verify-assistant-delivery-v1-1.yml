name: Verify Master assistant 1.1.1 real GitHub delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-assistant-delivery-v1-1.yml']
permissions:
  contents: write
jobs:
  windows-delivery:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Real fixed-repository upload and readback of already-public signature
        shell: powershell
        env:
          PUBLISHER_TEST_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $env:GITHUB_WORKSPACE 'publisher/assistant-v1.1.1/TRADE_OPERATIONS_SUITE_Master_Signing_Assistant_v1.1.1.zip'
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'dd146f56b1da1f1b289d8ee5a58a676054d8805c9bf5160e01090d0ec5209a4f'){throw 'Package mismatch'}
          $temp=Join-Path $env:RUNNER_TEMP ('publisher-network-'+[Guid]::NewGuid().ToString('N'))
          try {
            [IO.Compression.ZipFile]::ExtractToDirectory($zip,$temp)
            $root=Join-Path $temp 'TRADE_OPERATIONS_SUITE_Master_Signing_Assistant_v1.1.1'
            Import-Module (Join-Path $root 'Publisher.Core.psm1') -Force -DisableNameChecking
            Import-Module (Join-Path $root 'Publisher.Delivery.psm1') -Force -DisableNameChecking
            $feed=Get-PublisherNetworkText feed
            $verified=Read-PublisherEnvelope $feed
            if($verified.Document.sequence -ne 9){throw 'Test requires active sequence 9'}
            $work=Join-Path $temp 'connection'
            Connect-PublisherUpload $work $env:PUBLISHER_TEST_TOKEN $feed
            if(!(Test-PublisherUploadConnection $work)){throw 'DPAPI failed'}
            $first=Send-PublisherPublicResult $feed $env:PUBLISHER_TEST_TOKEN
            $again=Send-PublisherPublicResult $feed $env:PUBLISHER_TEST_TOKEN
            if(!$again.AlreadyDelivered -or $again.Path -cne $first.Path){throw 'Idempotency failed'}
            if((Get-PublisherNetworkText feed) -cne $feed){throw 'Active feed changed'}
            if((Get-FileHash 'updates/stable.signed.json' -Algorithm SHA256).Hash.ToLowerInvariant() -cne '238cf475f6b03f4cd7bbaf3d6d6db06fcfaa1af862798b088e15db0486cc3b5d'){throw 'Legacy bridge changed'}
            $record=[ordered]@{assistantVersion='1.1.1';checks=7;platform='Windows Server 2022 / PowerShell 5.1';realGitHubWriteReadback=$true;fixedPublicRepository=$true;duplicateDeliveryAvoided=$true;windowsDpapi=$true;productionPrivateKeyUsed=$false;userPcConnectionVerified=$false;activeFeedUnchanged=$true;legacyBridgeUnchanged=$true;inboxPath=$first.Path}
            [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'publisher/assistant-v1.1.1/ONLINE_VERIFICATION.json'),($record|ConvertTo-Json)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
            Write-Output 'PASS: 7 real delivery checks; no Master private key used.'
          } finally {
            $env:PUBLISHER_TEST_TOKEN=$null
            if(Test-Path -LiteralPath $temp){Remove-Item -LiteralPath $temp -Recurse -Force}
          }
      - name: Save public aggregate result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publisher/assistant-v1.1.1/ONLINE_VERIFICATION.json
          git commit -m 'test: actual Windows assistant upload readback verified'
          git pull --rebase origin main
          git push origin HEAD:main

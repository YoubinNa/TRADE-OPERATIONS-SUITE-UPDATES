name: Inspect shared control credential without deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-control-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect private control access through GET only
        env:
          RELEASE_CONTROL_TOKEN: ${{ secrets.RELEASE_CONTROL_TOKEN }}
        shell: bash
        run: |
          node <<'JS'
          (async()=>{
            const token=process.env.RELEASE_CONTROL_TOKEN;
            const result={schema:1,credentialConfigured:Boolean(token),sharedControlReadable:false,paused:null,actualWriteTested:false,checkedAt:new Date().toISOString()};
            if(token){
              try{
                const r=await fetch('https://api.github.com/repos/YoubinNa/TRADE-OPERATIONS-SUITE/contents/tools/release/jobs/release-0.1.116-6eb84f19a436/control.json?ref=main',{method:'GET',redirect:'error',signal:AbortSignal.timeout(15000),headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token}});
                result.httpStatus=r.status;
                if(r.ok){const d=await r.json();if(d.encoding==='base64'){const c=JSON.parse(Buffer.from(d.content.replace(/\s/g,''),'base64'));result.sharedControlReadable=c.schema===1;result.paused=c.paused!==false;}}
              }catch{result.errorCode='CONTROL_READ_CHECK_UNAVAILABLE';}
            }
            result.nextAction=!token?'configure-approved-private-control-read-credential':!result.sharedControlReadable?'verify-control-read-permission':result.paused?'keep-user-hold':'respect-existing-stage-approval';
            console.log(JSON.stringify(result));
          })().catch(()=>{console.error('READINESS_CHECK_FAILED');process.exitCode=1;});
          JS
